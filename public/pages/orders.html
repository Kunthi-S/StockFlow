<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders · StockFlow</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/orders.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>

  <main>
    <div class="page-header">
      <div>
        <h1>Orders</h1>
        <p class="subtitle">ORDERS split into ORDER_OUT (sales, to a customer) and ORDER_IN (purchases, from a supplier).</p>
      </div>
    </div>

    <p id="message" class="message"></p>

    <section class="panel">
      <div class="panel-header">
        <h2>New sales order (out)</h2>
      </div>
      <form id="sales-form" class="panel-body">
        <div class="form-grid">
          <label>Customer (company) ID
            <input name="customer_id" type="number" min="1" required>
          </label>
          <label>Required ship date
            <input name="required_ship_date" type="date" required>
          </label>
          <label>Ship-to address
            <input name="ship_to_address" type="text" maxlength="255" required>
          </label>
          <label>Product ID
            <input name="product_id" type="number" min="1" required>
          </label>
          <label>Quantity
            <input name="quantity" type="number" min="0.001" step="0.001" required>
          </label>
          <label>Unit price
            <input name="unit_price" type="number" min="0" step="0.01" required>
          </label>
        </div>
        <button type="submit" class="btn">Create sales order</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>New purchase order (in)</h2>
      </div>
      <form id="purchase-form" class="panel-body">
        <div class="form-grid">
          <label>Supplier (company) ID
            <input name="supplier_id" type="number" min="1" required>
          </label>
          <label>Expected arrival
            <input name="expected_arrival_date" type="date" required>
          </label>
          <label>Product ID
            <input name="product_id" type="number" min="1" required>
          </label>
          <label>Quantity
            <input name="quantity" type="number" min="0.001" step="0.001" required>
          </label>
          <label>Unit price
            <input name="unit_price" type="number" min="0" step="0.01" required>
          </label>
        </div>
        <button type="submit" class="btn">Create purchase order</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>All orders</h2>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Direction</th>
              <th>Party</th>
              <th>Date</th>
              <th>Status</th>
              <th>Total (THB)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="7" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../app.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
